version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: po-editor-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: po_editor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: po-editor-backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/po_editor?schema=public
      PORT: 3001
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "3002:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: po-editor-frontend
    ports:
      - "5175:80"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3002

volumes:
  postgres_data:
